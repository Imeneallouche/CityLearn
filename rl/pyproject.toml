[project]
name = "rl-city-learn"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.9,<3.10"

dependencies = [
    "citylearn>=2.5.0",
    "pyarrow>=10.0.1,<11.0.0",
    "pydantic>=2.12.4",
    "ray[rllib]>=2.38.0",
    "stable-baselines3>=2.3.2",
    "tensorboard>=2.20.0",
    "torch",
    "torchaudio",
    "torchvision",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
