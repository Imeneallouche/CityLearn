services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8000:8000"
    volumes:
      # Mount data and outputs read-only so the container sees them
      - ./datasets:/app/datasets:ro
      - ./outputs:/app/outputs:ro
      # Mount API code for live reload during development
      - ./api:/app/api:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
